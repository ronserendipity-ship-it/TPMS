[platformio]
src_dir = .

[env:nano_esp32_cc1101_tester]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps = jgromes/RadioLib@7.8.1
build_flags =
  -DBOARD_USES_HW_GPIO_NUMBERS
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<cc1101_tpms_tester.ino>
