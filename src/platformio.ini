; ============================================================
; TPMS receiver - Arduino Nano ESP32 + SX1278 Ra-02
; ============================================================
; Project layout (put it somewhere SHORT and outside OneDrive,
; for example C:\tpms):
;
;   C:\tpms\platformio.ini
;   C:\tpms\src\main.cpp
;   C:\tpms\lib\rtl_433_ESP\        <- copy of your working library
;       library.properties / library.json
;       src\rtl_433_ESP.h           <- your edited header, unchanged
;       src\...
;
; The radio type and pins (RF_SX1278, RF_MODULE_CS, ...) stay in
; your edited rtl_433_ESP.h, so they are NOT repeated here.
; Defining them in both places would cause redefinition clashes.
; The flags below are tuning and diagnostics only.
; ============================================================

[env:nano_esp32_sx1278]
monitor_dtr = 1
monitor_rts = 0
platform = espressif32
board = arduino_nano_esp32
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Find library dependencies from #include lines inside libraries too
lib_ldf_mode = chain+

lib_deps =
  bblanchon/ArduinoJson@^7
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
  adafruit/Adafruit BusIO
  jgromes/RadioLib@^6.6.0

build_flags =
  ; --- library diagnostics (print to the Serial Monitor) ---
  -DLOG_LEVEL=LOG_LEVEL_TRACE
  -DAVERAGE_RSSI=5000
  -DSIGNAL_RSSI=true
  -DARDUINO_USB_CDC_ON_BOOT=1

  ; --- tuning for weak far-wheel signals (header defaults shown) ---
  ; Lower RSSI_THRESHOLD = more sensitive to weak signals.
  ; Lower SX127X_RXBANDWIDTH = less noise admitted.
  ; Change ONE at a time, e.g. 9 -> 6, then 250 -> 125.
  -DRSSI_THRESHOLD=9
  -DSX127X_RXBANDWIDTH=250
